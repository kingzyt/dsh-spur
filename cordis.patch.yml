# 会话保活提醒：本包向宿主层插入的一行。
#
# 只 insert 自己的一行，不覆盖任何随附包的行：覆盖某个随附行会把它的整份配置
# 冻结在这个文件里，随附包升级时新增的字段就会被悄悄丢掉。
#
# 这一行故意不带 config：本插件的设置由右侧面板写入
# `<profile>/spur/settings.json`，那份文件优先于这里、也优先于代码里的默认值。
# 想改默认值又不想开面板时，也可以在这里给一行 config（面板保存过一次之后，
# 文件里的值会覆盖这里）。

- insert:
    - id: spur
      name: '@kingzyt/dsh-spur'
